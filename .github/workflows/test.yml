name: test

on:
  push:
    # branches only: a tag's release runs these tests itself (release.yml), so they do not run twice
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # its own group when release.yml calls it, so a release is never cancelled by a push's run
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    # the unit tests: no dependencies to install
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: git config --global user.email "ci@example.com" && git config --global user.name "CI"
      - run: npm test

  checks:
    # no unused code; the extension activates; the .vsix builds, holds what it must, and activates from itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # files earlier versions removed must not travel on: CI says which, and npm run tidy removes them
      - run: npm run tidy -- --check
      - run: npm run check
      - run: npm run package
      - run: npm run package:check
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: dist/*.vsix
          if-no-files-found: error

  browser:
    # the merge editor's page with the real Monaco, in Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          # here the checks must run: a missing browser fails instead of skipping
          CI_REQUIRE_BROWSER: '1'

  vscode:
    # the extension inside a real VS Code
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save @vscode/test-electron@^2.4.1
      - name: integration tests (Linux needs a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:vscode
      - name: integration tests
        if: runner.os != 'Linux'
        run: npm run test:vscode
